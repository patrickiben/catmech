<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">How catmech works</title>
  <desc id="d">Five panels from left to right. One: a table where every row has a recorded value and only audited rows have a checked value. Two: on audited rows, a regression of the checked value on the recorded value and the other variables. Three: each unaudited row's checked value is drawn 20 times from that model. Four: the analysis runs on each of the 20 completed copies. Five: Rubin's rules combine them into one estimate whose interval includes the spread between copies.</desc>
  <style>
    .bg { fill: #ffffff; } .card { fill: #f4f6f9; stroke: #d7dee7; }
    .ink { fill: #121a24; } .muted { fill: #4d5a69; } .cell { fill: #c3ccd8; } .empty { fill: none; stroke: #9aa6b5; stroke-dasharray: 3 2; }
    .check { fill: #0b7268; } .line { stroke: #0b7268; } .axis { stroke: #9aa6b5; } .arrow { stroke: #7d8a9b; fill: none; } .head { fill: #7d8a9b; }
    .copy { fill: #ffffff; stroke: #c3ccd8; } .bar { stroke: #4d5a69; } .dot { fill: #4d5a69; } .final { stroke: #0b7268; } .finaldot { fill: #0b7268; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; } .card { fill: #161e2a; stroke: #2e3a4d; }
      .ink { fill: #e8eef6; } .muted { fill: #98a5b8; } .cell { fill: #3a475b; } .empty { stroke: #62718a; }
      .check { fill: #3ad7c8; } .line { stroke: #3ad7c8; } .axis { stroke: #62718a; } .arrow { stroke: #8593a8; } .head { fill: #8593a8; }
      .copy { fill: #111721; stroke: #3a475b; } .bar { stroke: #98a5b8; } .dot { fill: #98a5b8; } .final { stroke: #3ad7c8; } .finaldot { fill: #3ad7c8; }
    }
    text { font-size: 13px; } .h { font-size: 14px; font-weight: 600; } .s { font-size: 12px; }
  </style>
  <rect class="bg" x="0" y="0" width="960" height="300"/>

  <!-- 1. Records -->
  <rect class="card" x="8" y="8" width="176" height="284" rx="8"/>
  <text class="ink h" x="20" y="32">1. Your records</text>
  <text class="muted s" x="34" y="56">recorded</text>
  <text class="muted s" x="106" y="56">checked</text>
  <g>
    <rect class="cell" x="34" y="66" width="56" height="14" rx="2"/><rect class="empty" x="106" y="66" width="56" height="14" rx="2"/>
    <rect class="cell" x="34" y="86" width="56" height="14" rx="2"/><rect class="check" x="106" y="86" width="56" height="14" rx="2"/>
    <rect class="cell" x="34" y="106" width="56" height="14" rx="2"/><rect class="empty" x="106" y="106" width="56" height="14" rx="2"/>
    <rect class="cell" x="34" y="126" width="56" height="14" rx="2"/><rect class="empty" x="106" y="126" width="56" height="14" rx="2"/>
    <rect class="cell" x="34" y="146" width="56" height="14" rx="2"/><rect class="check" x="106" y="146" width="56" height="14" rx="2"/>
    <rect class="cell" x="34" y="166" width="56" height="14" rx="2"/><rect class="empty" x="106" y="166" width="56" height="14" rx="2"/>
    <rect class="cell" x="34" y="186" width="56" height="14" rx="2"/><rect class="empty" x="106" y="186" width="56" height="14" rx="2"/>
    <rect class="cell" x="34" y="206" width="56" height="14" rx="2"/><rect class="check" x="106" y="206" width="56" height="14" rx="2"/>
  </g>
  <text class="muted s" x="20" y="246">Every row has a recorded</text>
  <text class="muted s" x="20" y="262">value. Audited rows also</text>
  <text class="muted s" x="20" y="278">have a checked one.</text>

  <path class="arrow" d="M186 150 H 200" stroke-width="2"/><path class="head" d="M200 145 L208 150 L200 155 Z"/>

  <!-- 2. Learn -->
  <rect class="card" x="210" y="8" width="176" height="284" rx="8"/>
  <text class="ink h" x="222" y="32">2. Learn</text>
  <line class="axis" x1="236" y1="208" x2="366" y2="208"/><line class="axis" x1="236" y1="208" x2="236" y2="62"/>
  <text class="muted s" x="270" y="226">recorded</text>
  <text class="muted s" x="0" y="0" transform="translate(228 166) rotate(-90)">checked</text>
  <line class="line" x1="244" y1="196" x2="358" y2="76" stroke-width="2"/>
  <circle class="check" cx="252" cy="182" r="4"/><circle class="check" cx="266" cy="176" r="4"/><circle class="check" cx="280" cy="150" r="4"/>
  <circle class="check" cx="296" cy="144" r="4"/><circle class="check" cx="312" cy="116" r="4"/><circle class="check" cx="326" cy="112" r="4"/>
  <circle class="check" cx="342" cy="88" r="4"/><circle class="check" cx="304" cy="132" r="4"/>
  <text class="muted s" x="222" y="246">On audited rows, regress</text>
  <text class="muted s" x="222" y="262">checked on recorded and the</text>
  <text class="muted s" x="222" y="278">other variables.</text>

  <path class="arrow" d="M388 150 H 402" stroke-width="2"/><path class="head" d="M402 145 L410 150 L402 155 Z"/>

  <!-- 3. Fill in -->
  <rect class="card" x="412" y="8" width="176" height="284" rx="8"/>
  <text class="ink h" x="424" y="32">3. Fill in 20 ways</text>
  <rect class="copy" x="456" y="62" width="96" height="132" rx="4"/>
  <rect class="copy" x="448" y="70" width="96" height="132" rx="4"/>
  <rect class="copy" x="440" y="78" width="96" height="132" rx="4"/>
  <g>
    <rect class="cell" x="450" y="90" width="34" height="12" rx="2"/><rect class="check" x="492" y="90" width="34" height="12" rx="2" opacity=".45"/>
    <rect class="cell" x="450" y="108" width="34" height="12" rx="2"/><rect class="check" x="492" y="108" width="34" height="12" rx="2"/>
    <rect class="cell" x="450" y="126" width="34" height="12" rx="2"/><rect class="check" x="492" y="126" width="34" height="12" rx="2" opacity=".45"/>
    <rect class="cell" x="450" y="144" width="34" height="12" rx="2"/><rect class="check" x="492" y="144" width="34" height="12" rx="2" opacity=".45"/>
    <rect class="cell" x="450" y="162" width="34" height="12" rx="2"/><rect class="check" x="492" y="162" width="34" height="12" rx="2"/>
    <rect class="cell" x="450" y="180" width="34" height="12" rx="2"/><rect class="check" x="492" y="180" width="34" height="12" rx="2" opacity=".45"/>
  </g>
  <text class="ink h" x="556" y="216">×20</text>
  <text class="muted s" x="424" y="246">Draw each missing checked</text>
  <text class="muted s" x="424" y="262">value from the model, with</text>
  <text class="muted s" x="424" y="278">its uncertainty, 20 times.</text>

  <path class="arrow" d="M590 150 H 604" stroke-width="2"/><path class="head" d="M604 145 L612 150 L604 155 Z"/>

  <!-- 4. Analyze each -->
  <rect class="card" x="614" y="8" width="160" height="284" rx="8"/>
  <text class="ink h" x="626" y="32">4. Analyze each</text>
  <g stroke-width="1.5">
    <line class="bar" x1="662" y1="70" x2="712" y2="70"/><circle class="dot" cx="686" cy="70" r="3"/>
    <line class="bar" x1="670" y1="88" x2="722" y2="88"/><circle class="dot" cx="696" cy="88" r="3"/>
    <line class="bar" x1="654" y1="106" x2="706" y2="106"/><circle class="dot" cx="680" cy="106" r="3"/>
    <line class="bar" x1="666" y1="124" x2="716" y2="124"/><circle class="dot" cx="691" cy="124" r="3"/>
    <line class="bar" x1="660" y1="142" x2="710" y2="142"/><circle class="dot" cx="685" cy="142" r="3"/>
    <line class="bar" x1="674" y1="160" x2="726" y2="160"/><circle class="dot" cx="700" cy="160" r="3"/>
    <line class="bar" x1="658" y1="178" x2="708" y2="178"/><circle class="dot" cx="683" cy="178" r="3"/>
    <line class="bar" x1="664" y1="196" x2="716" y2="196"/><circle class="dot" cx="690" cy="196" r="3"/>
  </g>
  <text class="muted s" x="626" y="246">Run your analysis on</text>
  <text class="muted s" x="626" y="262">every completed copy.</text>

  <path class="arrow" d="M776 150 H 790" stroke-width="2"/><path class="head" d="M790 145 L798 150 L790 155 Z"/>

  <!-- 5. Combine -->
  <rect class="card" x="800" y="8" width="152" height="284" rx="8"/>
  <text class="ink h" x="812" y="32">5. Combine</text>
  <line class="final" x1="836" y1="132" x2="920" y2="132" stroke-width="3"/>
  <line class="final" x1="836" y1="124" x2="836" y2="140" stroke-width="2"/><line class="final" x1="920" y1="124" x2="920" y2="140" stroke-width="2"/>
  <circle class="finaldot" cx="878" cy="132" r="6"/>
  <text class="muted s" x="812" y="246">One estimate. Its interval</text>
  <text class="muted s" x="812" y="262">adds how much the copies</text>
  <text class="muted s" x="812" y="278">disagree (Rubin's rules).</text>
</svg>
