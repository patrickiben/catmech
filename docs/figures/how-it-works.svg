<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">How catmech works</title>
  <desc id="d">Five panels from left to right. One: a table where every row has a recorded value and only audited rows have a checked value. Two: on audited rows, a regression of the checked value on the recorded value and the other variables. Three: each unaudited row's checked value is drawn 20 times from that model. Four: the analysis runs on each of the 20 completed copies. Five: Rubin's rules combine them into one estimate whose interval includes the spread between copies.</desc>
  <style>
    .bg { fill: #ffffff; } .card { fill: #f4f6f9; stroke: #d7dee7; }
    .ink { fill: #121a24; } .muted { fill: #4d5a69; } .cell { fill: #c3ccd8; } .empty { fill: none; stroke: #9aa6b5; stroke-dasharray: 3 2; }
    .check { fill: #0b7268; } .line { stroke: #0b7268; } .axis { stroke: #9aa6b5; } .arrow { stroke: #7d8a9b; fill: none; } .head { fill: #7d8a9b; }
    .copy { fill: #ffffff; stroke: #c3ccd8; } .bar { stroke: #4d5a69; } .dot { fill: #4d5a69; } .final { stroke: #0b7268; } .finaldot { fill: #0b7268; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; } .card { fill: #161e2a; stroke: #2e3a4d; }
      .ink { fill: #e8eef6; } .muted { fill: #98a5b8; } .cell { fill: #3a475b; } .empty { stroke: #62718a; }
      .check { fill: #3ad7c8; } .line { stroke: #3ad7c8; } .axis { stroke: #62718a; } .arrow { stroke: #8593a8; } .head { fill: #8593a8; }
      .copy { fill: #111721; stroke: #3a475b; } .bar { stroke: #98a5b8; } .dot { fill: #98a5b8; } .final { stroke: #3ad7c8; } .finaldot { fill: #3ad7c8; }
    }
    text { font-size: 13px; } .h { font-size: 14px; font-weight: 600; } .s { font-size: 12px; }
  </style>
  <rect class="bg" x="0" y="0" width="1000" height="330"/>

  <rect class="card" x="8" y="8" width="180" height="314" rx="8"/>
  <text class="ink h" x="22" y="32">1. Your records</text>
  <text class="muted s" x="22" y="248">Every row has a</text>
  <text class="muted s" x="22" y="264">recorded value.</text>
  <text class="muted s" x="22" y="280">Audited rows also</text>
  <text class="muted s" x="22" y="296">have a checked one.</text>
  <path class="arrow" d="M191 140 H 200" stroke-width="2"/><path class="head" d="M200 135 L207 140 L200 145 Z"/>
  <text class="muted s" x="32" y="58">recorded</text>
  <text class="muted s" x="108" y="58">checked</text>
  <rect class="cell" x="32" y="68" width="60" height="14" rx="2"/><rect class="empty" x="108" y="68" width="60" height="14" rx="2"/>
  <rect class="cell" x="32" y="88" width="60" height="14" rx="2"/><rect class="check" x="108" y="88" width="60" height="14" rx="2"/>
  <rect class="cell" x="32" y="108" width="60" height="14" rx="2"/><rect class="empty" x="108" y="108" width="60" height="14" rx="2"/>
  <rect class="cell" x="32" y="128" width="60" height="14" rx="2"/><rect class="empty" x="108" y="128" width="60" height="14" rx="2"/>
  <rect class="cell" x="32" y="148" width="60" height="14" rx="2"/><rect class="check" x="108" y="148" width="60" height="14" rx="2"/>
  <rect class="cell" x="32" y="168" width="60" height="14" rx="2"/><rect class="empty" x="108" y="168" width="60" height="14" rx="2"/>
  <rect class="cell" x="32" y="188" width="60" height="14" rx="2"/><rect class="empty" x="108" y="188" width="60" height="14" rx="2"/>
  <rect class="cell" x="32" y="208" width="60" height="14" rx="2"/><rect class="check" x="108" y="208" width="60" height="14" rx="2"/>

  <rect class="card" x="210" y="8" width="180" height="314" rx="8"/>
  <text class="ink h" x="224" y="32">2. Learn</text>
  <text class="muted s" x="224" y="248">On audited rows, fit</text>
  <text class="muted s" x="224" y="264">checked on recorded</text>
  <text class="muted s" x="224" y="280">and other variables.</text>
  <path class="arrow" d="M393 140 H 402" stroke-width="2"/><path class="head" d="M402 135 L409 140 L402 145 Z"/>
  <line class="axis" x1="240" y1="208" x2="374" y2="208"/><line class="axis" x1="240" y1="208" x2="240" y2="56"/>
  <text class="muted s" x="282" y="226">recorded</text>
  <text class="muted s" x="0" y="0" transform="translate(232 166) rotate(-90)">checked</text>
  <line class="line" x1="248" y1="196" x2="366" y2="70" stroke-width="2"/>
  <circle class="check" cx="256" cy="182" r="4"/>
  <circle class="check" cx="270" cy="176" r="4"/>
  <circle class="check" cx="284" cy="150" r="4"/>
  <circle class="check" cx="300" cy="144" r="4"/>
  <circle class="check" cx="316" cy="116" r="4"/>
  <circle class="check" cx="330" cy="112" r="4"/>
  <circle class="check" cx="346" cy="88" r="4"/>
  <circle class="check" cx="308" cy="132" r="4"/>

  <rect class="card" x="412" y="8" width="180" height="314" rx="8"/>
  <text class="ink h" x="426" y="32">3. Fill in 20 ways</text>
  <text class="muted s" x="426" y="248">Draw each missing</text>
  <text class="muted s" x="426" y="264">checked value from</text>
  <text class="muted s" x="426" y="280">the model, with its</text>
  <text class="muted s" x="426" y="296">uncertainty.</text>
  <path class="arrow" d="M595 140 H 604" stroke-width="2"/><path class="head" d="M604 135 L611 140 L604 145 Z"/>
  <rect class="copy" x="458" y="50" width="100" height="132" rx="4"/>
  <rect class="copy" x="450" y="58" width="100" height="132" rx="4"/>
  <rect class="copy" x="442" y="66" width="100" height="132" rx="4"/>
  <rect class="cell" x="454" y="78" width="36" height="12" rx="2"/><rect class="check" x="498" y="78" width="36" height="12" rx="2" opacity=".45"/>
  <rect class="cell" x="454" y="96" width="36" height="12" rx="2"/><rect class="check" x="498" y="96" width="36" height="12" rx="2"/>
  <rect class="cell" x="454" y="114" width="36" height="12" rx="2"/><rect class="check" x="498" y="114" width="36" height="12" rx="2" opacity=".45"/>
  <rect class="cell" x="454" y="132" width="36" height="12" rx="2"/><rect class="check" x="498" y="132" width="36" height="12" rx="2" opacity=".45"/>
  <rect class="cell" x="454" y="150" width="36" height="12" rx="2"/><rect class="check" x="498" y="150" width="36" height="12" rx="2"/>
  <rect class="cell" x="454" y="168" width="36" height="12" rx="2"/><rect class="check" x="498" y="168" width="36" height="12" rx="2" opacity=".45"/>
  <text class="ink h" x="548" y="218">×20</text>

  <rect class="card" x="614" y="8" width="180" height="314" rx="8"/>
  <text class="ink h" x="628" y="32">4. Analyze each</text>
  <text class="muted s" x="628" y="248">Run your analysis</text>
  <text class="muted s" x="628" y="264">on every completed</text>
  <text class="muted s" x="628" y="280">copy.</text>
  <path class="arrow" d="M797 140 H 806" stroke-width="2"/><path class="head" d="M806 135 L813 140 L806 145 Z"/>
  <line class="bar" x1="672" y1="62" x2="722" y2="62" stroke-width="1.5"/><circle class="dot" cx="696" cy="62" r="3"/>
  <line class="bar" x1="680" y1="80" x2="732" y2="80" stroke-width="1.5"/><circle class="dot" cx="706" cy="80" r="3"/>
  <line class="bar" x1="664" y1="98" x2="716" y2="98" stroke-width="1.5"/><circle class="dot" cx="690" cy="98" r="3"/>
  <line class="bar" x1="676" y1="116" x2="726" y2="116" stroke-width="1.5"/><circle class="dot" cx="701" cy="116" r="3"/>
  <line class="bar" x1="670" y1="134" x2="720" y2="134" stroke-width="1.5"/><circle class="dot" cx="695" cy="134" r="3"/>
  <line class="bar" x1="684" y1="152" x2="736" y2="152" stroke-width="1.5"/><circle class="dot" cx="710" cy="152" r="3"/>
  <line class="bar" x1="668" y1="170" x2="718" y2="170" stroke-width="1.5"/><circle class="dot" cx="693" cy="170" r="3"/>
  <line class="bar" x1="674" y1="188" x2="726" y2="188" stroke-width="1.5"/><circle class="dot" cx="700" cy="188" r="3"/>

  <rect class="card" x="816" y="8" width="180" height="314" rx="8"/>
  <text class="ink h" x="830" y="32">5. Combine</text>
  <text class="muted s" x="830" y="248">One estimate. Its</text>
  <text class="muted s" x="830" y="264">interval adds how</text>
  <text class="muted s" x="830" y="280">much the copies</text>
  <text class="muted s" x="830" y="296">disagree (Rubin's</text>
  <text class="muted s" x="830" y="312">rules).</text>
  <line class="final" x1="862" y1="132" x2="950" y2="132" stroke-width="3"/>
  <line class="final" x1="862" y1="124" x2="862" y2="140" stroke-width="2"/><line class="final" x1="950" y1="124" x2="950" y2="140" stroke-width="2"/>
  <circle class="finaldot" cx="906" cy="132" r="6"/>
</svg>
